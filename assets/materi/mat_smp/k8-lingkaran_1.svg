   <g id="text_7">
    <text style="font-weight: 700; font-size: 8.2px; font-family: 'DejaVu Sans', 'Segoe UI', 'Arial', sans-serif; text-anchor: middle; fill: #f472b6" x="642.539229" y="174.936436" transform="rotate(-0 642.539229 174.936436)">GSPD = √(d² - (R + r)²)</text>
   </g>
   <g id="text_8">
    <text style="font-size: 8px; font-family: 'DejaVu Sans', 'Segoe UI', 'Arial', sans-serif; text-anchor: middle; fill: #f8fafc" x="642.539229" y="205.2864" transform="rotate(-0 642.539229 205.2864)">Jarak Pusat (d = 26 cm)</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 8.1px; font-family: 'DejaVu Sans', 'Segoe UI', 'Arial', sans-serif; text-anchor: middle; fill: #f472b6" x="648.080628" y="230.518254" transform="rotate(-0 648.080628 230.518254)">TRIK HAFALAN CEPAT GSPL VS GSPD</text>
   </g>
   <g id="text_10">
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans', 'Segoe UI', 'Arial', sans-serif; fill: #f8fafc" transform="translate(554.325128 239.655528)">• GSPL (Luar)   --&gt; Jari-jari DIKURANGKAN : (R - r)</text>
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans', 'Segoe UI', 'Arial', sans-serif; fill: #f8fafc" transform="translate(604.713722 248.858843)">  GSPL = √(d² - (R - r)²)</text>
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans', 'Segoe UI', 'Arial', sans-serif; fill: #f8fafc" transform="translate(547.792097 258.062158)">• GSPD (Dalam)  --&gt; Jari-jari DITAMBAHKAN  : (R + r)</text>
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans', 'Segoe UI', 'Arial', sans-serif; fill: #f8fafc" transform="translate(602.091722 267.265473)">  GSPD = √(d² - (R + r)²)</text>
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans', 'Segoe UI', 'Arial', sans-serif; fill: #f8fafc" transform="translate(532.710847 276.468788)">Contoh GSPD: d = 26 cm, R = 6 cm, r = 4 cm  --&gt;  R+r = 10</text>
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans', 'Segoe UI', 'Arial', sans-serif; fill: #f8fafc" transform="translate(544.090066 285.672103)">  GSPD = √(26² - 10²) = √(676 - 100) = √576 = 24 cm!</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans', 'Segoe UI', 'Arial', sans-serif; text-anchor: middle; fill: #38bdf8" x="642.539229" y="52.208" transform="rotate(-0 642.539229 52.208)">2. Garis Singgung Dalam (GSPD): d² = GSPD² + (R + r)²</text>
   </g>
