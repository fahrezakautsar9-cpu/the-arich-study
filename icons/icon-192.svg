<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bg-grad-192" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="50%" stop-color="#4338ca"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accent-grad-192" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="gold-grad-192" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>
  <!-- Background Squircle -->
  <rect width="192" height="192" rx="48" fill="url(#bg-grad-192)"/>
  
  <!-- Subtle Geometry -->
  <circle cx="96" cy="96" r="68" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>
  <circle cx="96" cy="96" r="48" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
  
  <!-- Triangle Base -->
  <polygon points="56,142 136,142 96,73" fill="rgba(99, 102, 241, 0.3)" stroke="url(#accent-grad-192)" stroke-width="5" stroke-linejoin="round"/>
  
  <!-- Compass Arm Left & Right -->
  <line x1="96" y1="42" x2="60" y2="142" stroke="url(#gold-grad-192)" stroke-width="6.5" stroke-linecap="round"/>
  <line x1="96" y1="42" x2="132" y2="142" stroke="url(#gold-grad-192)" stroke-width="6.5" stroke-linecap="round"/>
  
  <!-- Compass Hinge & Knob -->
  <circle cx="96" cy="42" r="11" fill="#1e1b4b" stroke="url(#gold-grad-192)" stroke-width="5"/>
  <circle cx="96" cy="42" r="4" fill="#fbbf24"/>
  <line x1="96" y1="24" x2="96" y2="34" stroke="url(#gold-grad-192)" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Arc Gauge -->
  <path d="M 75,102 A 26,26 0 0,1 117,102" fill="none" stroke="url(#accent-grad-192)" stroke-width="3.5" stroke-linecap="round"/>
</svg>
