<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg-grad-512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="50%" stop-color="#4338ca"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accent-grad-512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="gold-grad-512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="glow-512" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background Squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bg-grad-512)"/>
  
  <!-- Subtle Geometry Circles -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2" stroke-dasharray="6 6"/>
  <circle cx="256" cy="256" r="130" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>
  <circle cx="256" cy="256" r="80" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2" stroke-dasharray="4 4"/>
  
  <!-- Drafting Compass & Mathematical Triangle -->
  <polygon points="150,380 362,380 256,196" fill="rgba(99, 102, 241, 0.25)" stroke="url(#accent-grad-512)" stroke-width="12" stroke-linejoin="round" filter="url(#glow-512)"/>
  <polygon points="200,355 312,355 256,258" fill="#0f172a" stroke="rgba(255,255,255,0.2)" stroke-width="4" stroke-linejoin="round"/>
  
  <!-- Compass Arm Left & Right -->
  <line x1="256" y1="110" x2="160" y2="380" stroke="url(#gold-grad-512)" stroke-width="16" stroke-linecap="round"/>
  <line x1="256" y1="110" x2="352" y2="380" stroke="url(#gold-grad-512)" stroke-width="16" stroke-linecap="round"/>
  
  <!-- Compass Top Hinge & Knob -->
  <circle cx="256" cy="110" r="28" fill="#1e1b4b" stroke="url(#gold-grad-512)" stroke-width="12"/>
  <circle cx="256" cy="110" r="10" fill="#fbbf24"/>
  <line x1="256" y1="65" x2="256" y2="90" stroke="url(#gold-grad-512)" stroke-width="10" stroke-linecap="round"/>
  
  <!-- Arc Gauge -->
  <path d="M 200,270 A 70,70 0 0,1 312,270" fill="none" stroke="url(#accent-grad-512)" stroke-width="8" stroke-linecap="round"/>
  
  <!-- Sparkles -->
  <polygon points="380,140 386,155 401,161 386,167 380,182 374,167 359,161 374,155" fill="#38bdf8"/>
  <polygon points="120,200 124,210 134,214 124,218 120,228 116,218 106,214 116,210" fill="#fbbf24"/>
</svg>
